<div class="flex-1 flex items-center justify-center bg-[#edf0f4] min-h-full py-16">
  <div
    class="bg-white rounded-2xl border border-gray-100 shadow-sm p-10 flex flex-col items-center gap-5 max-w-sm w-full text-center"
  >
    <div class="w-20 h-20 rounded-full bg-green-50 flex items-center justify-center">
      <i class="fa-solid fa-circle-check text-green-500 text-4xl"></i>
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-800">Order Confirmed!</h2>
      <p class="text-[13px] text-gray-400 mt-1.5">
        Your order has been placed successfully.<br />Thank you for shopping with PhoneShop.
      </p>
    </div>
    <div
      class="w-full bg-green-50 border border-green-100 rounded-xl px-5 py-4 flex flex-col gap-2"
    >
      <div class="flex items-center gap-2 text-green-600 text-[13px] font-semibold">
        <i class="fa-solid fa-truck-fast"></i>
        Your order is being processed
      </div>
      <p class="text-[11px] text-gray-400">
        You will receive a notification once your order is shipped.
      </p>
    </div>
    <div class="flex gap-3 w-full mt-2">
      <button
        (click)="goHome()"
        class="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors"
      >
        Back to Home
      </button>
      <button
        (click)="goProducts()"
        class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors"
      >
        Shop More
      </button>
    </div>
  </div>
</div>
